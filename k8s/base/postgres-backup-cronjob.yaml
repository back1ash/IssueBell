apiVersion: v1
kind: ServiceAccount
metadata:
  name: issuebell-backup
  namespace: issuebell
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: issuebell-postgres-backup
  namespace: issuebell
  labels:
    app.kubernetes.io/name: issuebell-postgres-backup
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: issuebell-postgres-backup
        spec:
          serviceAccountName: issuebell-backup
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump-postgres
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - >-
                  pg_dump --host=postgres --port=5432 --username=issuebell
                  --dbname=issuebell --format=custom --compress=9
                  --no-owner --no-privileges --file=/backup/issuebell.dump
                  && chmod 0644 /backup/issuebell.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: issuebell-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          containers:
            - name: upload-to-object-storage
              image: ghcr.io/oracle/oci-cli:20260930
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-euc"]
              args:
                - |
                  dump=/backup/issuebell.dump
                  test -s "$dump"
                  object_name="issuebell/postgresql/issuebell-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  oci os object put \
                    --bucket-name "$OCI_BUCKET_NAME" \
                    --name "$object_name" \
                    --file "$dump" \
                    --verify-checksum
                  oci os object head \
                    --bucket-name "$OCI_BUCKET_NAME" \
                    --name "$object_name" >/dev/null
                  echo "Uploaded and verified $object_name"
              env:
                - name: OCI_BUCKET_NAME
                  value: issuebell-db-backups
                - name: HOME
                  value: /tmp
                - name: OCI_CLI_CONFIG_FILE
                  value: /oracle/.oci/config
                - name: OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING
                  value: "True"
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
                  readOnly: true
                - name: oci-config
                  mountPath: /oracle/.oci
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          volumes:
            - name: backup-data
              emptyDir:
                sizeLimit: 5Gi
            - name: oci-config
              secret:
                secretName: issuebell-backup-oci
                defaultMode: 0440
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
