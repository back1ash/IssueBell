apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: issuebell
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: issuebell
            - name: POSTGRES_USER
              value: issuebell
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: issuebell-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "issuebell", "-d", "issuebell"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "issuebell", "-d", "issuebell"]
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "issuebell", "-d", "issuebell"]
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            # Reuse the existing claim so Deployment -> StatefulSet does not
            # create an empty database volume during the transition.
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: issuebell
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
