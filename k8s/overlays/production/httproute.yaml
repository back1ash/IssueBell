apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: issuebell
  namespace: issuebell
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
      sectionName: https-issuebell
  hostnames:
    - issuebell.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: issuebell
          port: 80
