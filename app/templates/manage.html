<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IssueBell — Manage</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="stylesheet" href="/static/style.css?v=4" />
  <style>
    /* ── Admin-specific styles ───────────────────────────────────── */
    .admin-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .admin-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .admin-title span {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 10px;
    }
    .search-box {
      display: flex;
      gap: 8px;
    }
    .search-input {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 14px;
      font-size: 0.875rem;
      color: var(--text);
      outline: none;
      width: 240px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    /* ── User table ─────────────────────────────────────────────── */
    .user-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    .user-table th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 10px 14px;
      border-bottom: 2px solid var(--border);
      background: var(--surface-2);
    }
    .user-table th:first-child { border-radius: 10px 0 0 0; }
    .user-table th:last-child  { border-radius: 0 10px 0 0; }

    .user-row {
      cursor: pointer;
      transition: background 0.12s;
    }
    .user-row:hover { background: var(--surface-2); }
    .user-row.expanded { background: var(--label-bg); }
    .user-row td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 8px;
    }
    .user-avatar--placeholder {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      margin-right: 8px;
      vertical-align: middle;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--label-bg);
      color: var(--accent);
    }
    .tag--green { background: rgba(34,197,94,0.12); color: #15803d; }
    .tag--gray  { background: var(--surface-2); color: var(--text-muted); }

    .expand-icon {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .expanded .expand-icon { transform: rotate(90deg); }

    /* ── Subscription sub-rows ──────────────────────────────────── */
    .sub-rows td {
      padding: 0;
      border-bottom: 1px solid var(--border);
    }
    .sub-rows-inner {
      padding: 10px 14px 14px 56px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sub-entry {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }
    .sub-entry__repo {
      font-weight: 600;
      color: var(--accent);
    }
    .sub-entry__label {
      font-size: 0.72rem;
      font-weight: 600;
      background: #ede9fe;
      color: #5b21b6;
      border-radius: 999px;
      padding: 1px 9px;
    }
    .sub-entry__date {
      color: var(--text-muted);
      font-size: 0.72rem;
      margin-left: auto;
    }
    .sub-empty {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-style: italic;
    }

    .stat-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      box-shadow: var(--shadow-sm);
      flex: 1;
    }
    .stat-card__label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px; }
    .stat-card__value { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em; }

    .empty-admin {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- ── Navbar ─────────────────────────────────────────────────── -->
  <header class="navbar">
    <div class="navbar__brand">
      <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
        <img src="/static/logo-192.png" alt="IssueBell" class="navbar__logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <span class="navbar__logo-fallback"><span class="navbar__bell">🔔</span><span class="navbar__title">IssueBell</span></span>
      </a>
      <span style="font-size:0.75rem;font-weight:700;color:var(--accent);background:var(--label-bg);padding:3px 10px;border-radius:999px;letter-spacing:0.06em;">ADMIN</span>
    </div>
    <nav class="navbar__actions">
      <div class="avatar-wrapper">
        {% if user.avatar %}
          <img class="avatar" src="https://cdn.discordapp.com/avatars/{{ user.discord_id }}/{{ user.avatar }}.png?size=64" alt="{{ user.username }}" />
        {% else %}
          <div class="avatar avatar--placeholder">{{ user.username[0] | upper }}</div>
        {% endif %}
        <span class="username">{{ user.username }}</span>
      </div>
      <a href="/" class="btn btn--ghost btn--sm">← Dashboard</a>
      <form method="post" action="/auth/logout" style="display:inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button type="submit" class="btn btn--ghost btn--sm">Logout</button>
      </form>
    </nav>
  </header>

  <div class="admin-wrap">
    <!-- ── Stats ──────────────────────────────────────────────── -->
    <div class="stat-bar" id="stat-bar">
      <div class="stat-card">
        <div class="stat-card__label">Total Users</div>
        <div class="stat-card__value" id="stat-users">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">GitHub Connected</div>
        <div class="stat-card__value" id="stat-github">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Total Subscriptions</div>
        <div class="stat-card__value" id="stat-subs">—</div>
      </div>
    </div>

    <!-- ── Header + Search ───────────────────────────────────── -->
    <div class="admin-header">
      <div class="admin-title">Users <span id="result-count"></span></div>
      <div class="search-box">
        <input class="search-input" id="search" type="search" placeholder="Search by username…" autocomplete="off" />
      </div>
    </div>

    <!-- ── Table ──────────────────────────────────────────────── -->
    <div class="table-wrap">
      <table class="user-table">
        <thead>
          <tr>
            <th>User</th>
            <th>GitHub</th>
            <th>Subscriptions</th>
            <th>Joined</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="user-tbody">
          <tr><td colspan="5" class="empty-admin">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allUsers = [];

    function renderTableMessage(message) {
      const tbody = document.getElementById('user-tbody');
      tbody.replaceChildren();
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 5;
      td.className = 'empty-admin';
      td.textContent = message;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    async function loadUsers(q = '') {
      try {
        const url = '/admin/users' + (q ? `?q=${encodeURIComponent(q)}` : '');
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (res.status === 401 || res.status === 403) {
          renderTableMessage('Access denied.');
          return;
        }
        if (!res.ok) {
          renderTableMessage('Could not load users. Please try again.');
          return;
        }
        const payload = await res.json();
        allUsers = Array.isArray(payload) ? payload : [];
        renderUsers(allUsers);
        updateStats(allUsers);
      } catch (_error) {
        renderTableMessage('Could not load users. Please try again.');
      }
    }

    function updateStats(users) {
      document.getElementById('stat-users').textContent = users.length;
      document.getElementById('stat-github').textContent = users.filter(u => u.github_connected).length;
      document.getElementById('stat-subs').textContent = users.reduce(
        (total, user) => total + (Array.isArray(user.subscriptions) ? user.subscriptions.length : 0),
        0,
      );
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return '—';
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function textElement(tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = String(text ?? '');
      return element;
    }

    function safeDiscordAvatar(user) {
      const discordId = String(user.discord_id ?? '');
      const avatar = String(user.avatar ?? '');
      if (!/^\d{1,32}$/.test(discordId) || !/^[A-Za-z0-9_]{1,128}$/.test(avatar)) {
        return null;
      }
      return `https://cdn.discordapp.com/avatars/${discordId}/${avatar}.png?size=64`;
    }

    function safeGitHubRepoUrl(repoName) {
      const parts = String(repoName ?? '').split('/');
      const safePart = part => /^[A-Za-z0-9_.-]{1,100}$/.test(part) && part !== '.' && part !== '..';
      if (parts.length !== 2 || !parts.every(safePart)) return null;
      return `https://github.com/${encodeURIComponent(parts[0])}/${encodeURIComponent(parts[1])}`;
    }

    function renderUsers(users) {
      const tbody = document.getElementById('user-tbody');
      document.getElementById('result-count').textContent = users.length > 0 ? `(${users.length})` : '';

      if (!users.length) {
        renderTableMessage('No users found.');
        return;
      }

      tbody.replaceChildren();
      const fragment = document.createDocumentFragment();
      users.forEach(u => {
        const subscriptions = Array.isArray(u.subscriptions) ? u.subscriptions : [];
        const username = String(u.username ?? 'Unknown user');
        const subCount = subscriptions.length;

        // User row
        const tr = document.createElement('tr');
        tr.className = 'user-row';

        const userCell = document.createElement('td');
        const avatarUrl = safeDiscordAvatar(u);
        if (avatarUrl) {
          const avatar = document.createElement('img');
          avatar.className = 'user-avatar';
          avatar.src = avatarUrl;
          avatar.alt = '';
          avatar.referrerPolicy = 'no-referrer';
          userCell.appendChild(avatar);
        } else {
          const initial = Array.from(username)[0]?.toLocaleUpperCase() ?? '?';
          userCell.appendChild(textElement('span', 'user-avatar--placeholder', initial));
        }
        userCell.appendChild(textElement('strong', '', username));
        tr.appendChild(userCell);

        const githubCell = document.createElement('td');
        githubCell.appendChild(
          u.github_connected
            ? textElement('span', 'tag tag--green', `✓ ${String(u.github_username ?? '')}`)
            : textElement('span', 'tag tag--gray', 'Not connected'),
        );
        tr.appendChild(githubCell);

        const countCell = document.createElement('td');
        const count = textElement('span', subCount > 0 ? 'badge' : '', subCount);
        if (subCount === 0) {
          count.style.color = 'var(--text-muted)';
          count.style.fontSize = '0.82rem';
        }
        countCell.appendChild(count);
        tr.appendChild(countCell);

        const joinedCell = textElement('td', '', fmtDate(u.created_at));
        joinedCell.style.color = 'var(--text-muted)';
        joinedCell.style.fontSize = '0.82rem';
        tr.appendChild(joinedCell);

        const expandCell = document.createElement('td');
        expandCell.appendChild(textElement('span', 'expand-icon', '▶'));
        tr.appendChild(expandCell);

        // Subscription sub-row
        const subTr = document.createElement('tr');
        subTr.className = 'sub-rows';
        subTr.style.display = 'none';
        const subCell = document.createElement('td');
        subCell.colSpan = 5;
        const subRows = document.createElement('div');
        subRows.className = 'sub-rows-inner';
        if (subCount === 0) {
          subRows.appendChild(textElement('div', 'sub-empty', 'No subscriptions.'));
        } else {
          subscriptions.forEach(subscription => {
            const entry = document.createElement('div');
            entry.className = 'sub-entry';
            const repoName = String(subscription.repo_full_name ?? 'Unknown repository');
            const repoUrl = safeGitHubRepoUrl(repoName);
            if (repoUrl) {
              const link = textElement('a', 'sub-entry__repo', repoName);
              link.href = repoUrl;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              entry.appendChild(link);
            } else {
              entry.appendChild(textElement('span', 'sub-entry__repo', repoName));
            }
            entry.appendChild(textElement('span', 'sub-entry__label', subscription.label));
            entry.appendChild(
              textElement('span', 'sub-entry__date', `checked ${fmtDate(subscription.last_checked_at)}`),
            );
            subRows.appendChild(entry);
          });
        }
        subCell.appendChild(subRows);
        subTr.appendChild(subCell);

        tr.addEventListener('click', () => {
          const open = subTr.style.display !== 'none';
          subTr.style.display = open ? 'none' : 'table-row';
          tr.classList.toggle('expanded', !open);
        });

        fragment.appendChild(tr);
        fragment.appendChild(subTr);
      });
      tbody.appendChild(fragment);
    }

    // Search with debounce
    let debounce;
    document.getElementById('search').addEventListener('input', e => {
      clearTimeout(debounce);
      debounce = setTimeout(() => loadUsers(e.target.value.trim()), 300);
    });

    loadUsers();
  </script>
</body>
</html>
