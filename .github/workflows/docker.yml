name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**' # GitOps 이미지 태그 갱신 커밋이 다시 빌드하지 않도록 제외

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to push updated deployment.yaml back
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/back1ash/issuebell:latest
            ghcr.io/back1ash/issuebell:sha-${{ github.sha }}

      - name: Update production image tag
        run: |
          sed -i 's|newTag: .*|newTag: sha-${{ github.sha }}|' k8s/overlays/production/kustomization.yaml

      - name: Commit and push updated production image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: deploy sha-${{ github.sha }}"
          git push
