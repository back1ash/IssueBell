name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**' # GitOps 이미지 태그 갱신 커밋이 다시 빌드하지 않도록 제외

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to push updated deployment.yaml back
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/back1ash/issuebell:latest
            ghcr.io/back1ash/issuebell:sha-${{ github.sha }}

      - name: Update production image tag
        run: sed -i "s|newTag: .*|newTag: sha-${{ github.sha }}|" k8s/overlays/production/kustomization.yaml

      - name: Commit and push updated production image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: deploy sha-${{ github.sha }}"
          git push
