name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**" # Do not rebuild GitOps image-tag-only updates.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_KEY: ci-only-secret-key-that-is-not-used-in-production
      TOKEN_ENCRYPTION_KEY: ci-only-token-key-that-is-not-used-in-production
      DATABASE_URL: sqlite:///./issuebell-ci.db
      SESSION_HTTPS_ONLY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m pytest

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to push the production image tag update
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/back1ash/issuebell:latest
            ghcr.io/back1ash/issuebell:sha-${{ github.sha }}

      - name: Update production image tag
        run: |
          sed -i 's|newTag: .*|newTag: sha-${{ github.sha }}|' k8s/overlays/production/kustomization.yaml

      - name: Commit and push updated production image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: deploy sha-${{ github.sha }}"
          git push
